# Confere tipos, roda os testes e compila o site a cada Pull Request e a cada envio para a main.
# Os testes usam um Postgres descartável criado só para isso (nunca o banco de produção).
name: Testes e build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agendatest
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agendatest
      AUTH_SECRET: somente-para-o-build-do-ci-nao-usar-em-producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Conferir tipos (TypeScript)
        run: npx tsc --noEmit
      - name: Criar as tabelas no banco de teste
        run: npx prisma db push --skip-generate
      - run: npm test
      - run: npm run build
